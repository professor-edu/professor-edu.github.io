<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nota100Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="nota50Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="cobreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>

  <!-- Sombra base -->
  <ellipse cx="50" cy="88" rx="38" ry="6" fill="#cbd5e1" opacity="0.6" />

  <!-- Nota de 100€ (Verde, atrás) -->
  <g transform="rotate(-10 52 34)">
    <rect x="18" y="14" width="68" height="38" rx="6" fill="url(#nota100Grad)" stroke="#14532d" stroke-width="2.5" />
    <text x="44" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">100€</text>
  </g>

  <!-- Nota de 50€ (Laranja, meio) -->
  <g transform="rotate(6 52 46)">
    <rect x="18" y="28" width="68" height="38" rx="6" fill="url(#nota50Grad)" stroke="#7c2d12" stroke-width="2.5" />
    <text x="56" y="52" font-family="system-ui, sans-serif" font-size="17" font-weight="900" fill="#ffffff" text-anchor="middle">50€</text>
  </g>

  <!-- Moeda de 50 cêntimos (Dourada) -->
  <g transform="translate(34, 68)">
    <circle cx="0" cy="0" r="17" fill="#fde047" stroke="#a16207" stroke-width="2.5" />
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12.5" font-weight="900" fill="#713f12" text-anchor="middle">50c</text>
  </g>

  <!-- Moeda de 5 cêntimos (Cobre) -->
  <g transform="translate(64, 71)">
    <circle cx="0" cy="0" r="14.5" fill="url(#cobreGrad)" stroke="#7c2d12" stroke-width="2.5" />
    <text x="0" y="4.5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" text-anchor="middle">5c</text>
  </g>
</svg>