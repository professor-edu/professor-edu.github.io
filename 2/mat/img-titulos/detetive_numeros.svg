<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
  <!-- Ficha Verde (Centenas) -->
  <g transform="rotate(-11 18 25)">
    <rect x="7" y="12" width="22" height="27" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="2.2" />
    <text x="18" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#047857">1</text>
  </g>

  <!-- Ficha Vermelha (Dezenas) -->
  <g transform="rotate(3 32 21)">
    <rect x="21" y="8" width="22" height="27" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2" />
    <text x="32" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#b91c1c">2</text>
  </g>

  <!-- Ficha Azul (Unidades) -->
  <g transform="rotate(12 46 25)">
    <rect x="35" y="12" width="22" height="27" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2" />
    <text x="46" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#1d4ed8">3</text>
  </g>

  <!-- Cabo da Lupa -->
  <line x1="43" y1="43" x2="56" y2="56" stroke="#78350f" stroke-width="6.5" stroke-linecap="round" />
  <line x1="43" y1="43" x2="56" y2="56" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />

  <!-- Aro e Lente da Lupa -->
  <circle cx="33" cy="33" r="14.5" fill="#eff6ff" fill-opacity="0.65" stroke="#b45309" stroke-width="4.5" />
  <circle cx="33" cy="33" r="14.5" fill="none" stroke="#fbbf24" stroke-width="2.2" />

  <!-- Número ampliado dentro da lente -->
  <text x="33" y="39" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="900" fill="#1e3a8a">2</text>

  <!-- Brilho do vidro da lente -->
  <path d="M24 27 A11 11 0 0 1 34 22.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" />

  <!-- Estrelas de pista descoberta -->
  <polygon points="10,6 11.4,9.6 15,11 11.4,12.4 10,16 8.6,12.4 5,11 8.6,9.6" fill="#f59e0b" />
  <polygon points="15,44 16,46.8 18.8,47.8 16,48.8 15,51.6 14,48.8 11.2,47.8 14,46.8" fill="#3b82f6" />
</svg>