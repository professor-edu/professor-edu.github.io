<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bgCard1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="tileO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="tileA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
  </defs>
  <rect x="4" y="6" width="72" height="70" rx="18" fill="#cbd5e1" />
  <rect x="4" y="4" width="72" height="70" rx="18" fill="url(#bgCard1)" />
  <!-- Peça Azul O -->
  <g transform="rotate(-8 28 38)">
    <rect x="13" y="21" width="30" height="34" rx="8" fill="#1d4ed8" />
    <rect x="13" y="19" width="30" height="34" rx="8" fill="url(#tileO)" />
    <text x="28" y="43" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="900" fill="#ffffff">O</text>
  </g>
  <!-- Peça Rosa A -->
  <g transform="rotate(8 52 42)">
    <rect x="37" y="25" width="30" height="34" rx="8" fill="#9d174d" />
    <rect x="37" y="23" width="30" height="34" rx="8" fill="url(#tileA)" />
    <text x="52" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="900" fill="#ffffff">A</text>
  </g>
</svg>