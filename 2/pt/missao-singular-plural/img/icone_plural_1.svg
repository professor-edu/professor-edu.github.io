<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pl1Blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="pl1Pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="pl1Gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Base branca arredondada -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#ffffff" />

  <!-- Peça traseira (Plural: OS) -->
  <rect x="27" y="23" width="27" height="27" rx="7" fill="#9d174d" />
  <rect x="27" y="20" width="27" height="27" rx="7" fill="url(#pl1Pink)" />
  <text x="40.5" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff">OS</text>

  <!-- Peça frontal (Singular: O) -->
  <rect x="10" y="15" width="26" height="26" rx="7" fill="#1d4ed8" />
  <rect x="10" y="12" width="26" height="26" rx="7" fill="url(#pl1Blue)" stroke="#ffffff" stroke-width="1.5" />
  <text x="23" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff">O</text>

  <!-- Etiqueta +S -->
  <rect x="33" y="42" width="22" height="13" rx="6.5" fill="#b45309" />
  <rect x="33" y="40.5" width="22" height="13" rx="6.5" fill="url(#pl1Gold)" stroke="#ffffff" stroke-width="1.5" />
  <text x="44" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="900" fill="#78350f">+S</text>
</svg>