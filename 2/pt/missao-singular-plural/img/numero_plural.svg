<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <linearGradient id="gradPlurBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="gradPlurFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="gradPlurStar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Sombra suave no chão -->
  <ellipse cx="102" cy="135" rx="58" ry="6" fill="#cbd5e1" opacity="0.6" />

  <!-- Peça 3D Traseira (representa multiplicidade) -->
  <g transform="rotate(-10 76 74)">
    <rect x="30" y="26" width="96" height="96" rx="22" fill="#9d174d" />
    <rect x="30" y="21" width="96" height="96" rx="22" fill="url(#gradPlurBack)" />
    <rect x="38" y="26" width="80" height="12" rx="6" fill="#ffffff" opacity="0.22" />
  </g>

  <!-- Peça 3D Principal (Plural) -->
  <g transform="rotate(4 114 74)">
    <rect x="58" y="26" width="110" height="100" rx="22" fill="#5b21b6" />
    <rect x="58" y="20" width="110" height="100" rx="22" fill="url(#gradPlurFront)" />
    <rect x="66" y="25" width="94" height="13" rx="6.5" fill="#ffffff" opacity="0.22" />

    <!-- Texto Principal: OS / AS -->
    <text x="113" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="0.5">
      OS <tspan font-size="23" opacity="0.8">/</tspan> AS
    </text>

    <!-- Subtexto: UNS • UMAS -->
    <text x="113" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" fill="#f3e8ff" letter-spacing="0.8">
      UNS • UMAS
    </text>
  </g>

  <!-- Conjunto de 3 estrelas (vários elementos) no canto superior direito -->
  <g transform="translate(162, 24)">
    <circle cx="0" cy="2" r="15" fill="#d97706" />
    <circle cx="0" cy="0" r="15" fill="url(#gradPlurStar)" stroke="#ffffff" stroke-width="2.5" />
    <polygon points="0,-7 1.8,-2.5 6.5,-2.2 2.9,0.8 4,5.4 0,2.9 -4,5.4 -2.9,0.8 -6.5,-2.2 -1.8,-2.5" fill="#78350f" />
  </g>
  <circle cx="143" cy="14" r="4" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="177" cy="41" r="3.5" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" />
</svg>