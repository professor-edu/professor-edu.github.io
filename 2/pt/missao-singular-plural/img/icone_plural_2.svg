  <polygon points="15,42 16,52 24,46" fill="#059669" />

  <!-- Pílula central 3D (-ES) -->
  <rect x="16" y="24" width="32" height="20" rx="7" fill="#5b21b6" />
  <rect x="16" y="21.5" width="32" height="20" rx="7" fill="url(#pl2Purple)" />
  <text x="32" y="35.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="0.5">-ES</text>
