<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 5 80 91" width="100%" height="100%">
  <defs>
    <!-- Gradiente Vermelho Pixar (Telhados e Bandeira) -->
    <radialGradient id="roof-grad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF8E8E" />
      <stop offset="55%" stop-color="#FF4757" />
      <stop offset="100%" stop-color="#B31217" />
    </radialGradient>

    <!-- Gradiente Creme 3D (Paredes da Escola) -->
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0" />
      <stop offset="70%" stop-color="#F7E1D7" />
      <stop offset="100%" stop-color="#E5C4B5" />
    </linearGradient>

    <!-- Gradiente da Porta de Madeira -->
    <radialGradient id="door-grad" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#85586F" />
      <stop offset="100%" stop-color="#4E313D" />
    </radialGradient>

    <!-- Gradiente Brilhante das Janelas -->
    <radialGradient id="window-glow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="60%" stop-color="#FBC531" />
      <stop offset="100%" stop-color="#E1B12C" />
    </radialGradient>

    <!-- Gradiente Dourado (Moldura do Relógio) -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="100%" stop-color="#FDCB6E" />
    </linearGradient>
  </defs>

  <!-- Sombra no Solo -->
  <ellipse cx="50" cy="91" rx="40" ry="5.5" fill="rgba(0,0,0,0.18)" />

  <!-- Mastro e Bandeira Escolar -->
  <line x1="50" y1="22" x2="50" y2="7" stroke="#B31217" stroke-width="2" stroke-linecap="round" />
  <path d="M 50 7 C 56 5 60 11 65 9 L 65 17 C 59 19 55 13 50 15 Z" fill="url(#roof-grad)" />

  <!-- Parede da Torre do Relógio -->
  <rect x="36" y="30" width="28" height="26" fill="url(#wall-grad)" />

  <!-- Telhado da Torre -->
  <path d="M 33 28 C 33 28 50 16 50 16 C 50 16 67 28 67 28 C 69 29 68 32 65 32 L 35 32 C 32 32 31 29 33 28 Z" fill="url(#roof-grad)" />
  <path d="M 38 27 C 45 20 50 19 50 19 C 50 19 46 22 41 29 Z" fill="white" opacity="0.45" />

  <!-- Relógio da Escola -->
  <circle cx="50" cy="41" r="7.5" fill="url(#gold-grad)" />
  <circle cx="50" cy="41" r="6" fill="#FFF8F0" />
  <path d="M 50 41 L 50 37.5 M 50 41 L 53.5 41" stroke="#4E313D" stroke-width="1.5" stroke-linecap="round" />

  <!-- Paredes do Corpo Principal -->
  <path d="M 18 54 L 82 54 L 79 88 C 79 90 76 91 72 91 L 28 91 C 24 91 21 90 21 88 Z" fill="url(#wall-grad)" />
  <path d="M 18 54 L 82 54 L 80 58 L 20 58 Z" fill="rgba(0,0,0,0.07)" />

  <!-- Telhado Principal Lado a Lado -->
  <path d="M 12 52 C 12 52 50 38 50 38 C 50 38 88 52 88 52 C 90 53 88 56 85 56 L 15 56 C 12 56 10 53 12 52 Z" fill="url(#roof-grad)" />
  <path d="M 20 51 C 32 44 50 42 50 42 C 50 42 35 46 20 53 Z" fill="white" opacity="0.45" />

  <!-- Janelas com Brilho Glow -->
  <!-- Esquerda Superior -->
  <rect x="25" y="62" width="10" height="10" rx="2.5" fill="url(#window-glow)" stroke="#FFF8F0" stroke-width="1.2" />
  <line x1="30" y1="62" x2="30" y2="72" stroke="#FFF8F0" stroke-width="1" />
  <line x1="25" y1="67" x2="35" y2="67" stroke="#FFF8F0" stroke-width="1" />

  <!-- Direita Superior -->
  <rect x="65" y="62" width="10" height="10" rx="2.5" fill="url(#window-glow)" stroke="#FFF8F0" stroke-width="1.2" />
  <line x1="70" y1="62" x2="70" y2="72" stroke="#FFF8F0" stroke-width="1" />
  <line x1="65" y1="67" x2="75" y2="67" stroke="#FFF8F0" stroke-width="1" />

  <!-- Esquerda Inferior -->
  <rect x="25" y="77" width="10" height="9" rx="2" fill="url(#window-glow)" stroke="#FFF8F0" stroke-width="1.2" />
  <line x1="30" y1="77" x2="30" y2="86" stroke="#FFF8F0" stroke-width="1" />

  <!-- Direita Inferior -->
  <rect x="65" y="77" width="10" height="9" rx="2" fill="url(#window-glow)" stroke="#FFF8F0" stroke-width="1.2" />
  <line x1="70" y1="77" x2="70" y2="86" stroke="#FFF8F0" stroke-width="1" />

  <!-- Moldura e Arco de Entrada -->
  <path d="M 40 91 L 40 68 C 40 62 44 58 50 58 C 56 58 60 62 60 68 L 60 91 Z" fill="#E5C4B5" />

  <!-- Porta Dupla de Madeira -->
  <path d="M 42 91 L 42 70 C 42 65 45 61 50 61 C 55 61 58 65 58 70 L 58 91 Z" fill="url(#door-grad)" />
  <line x1="50" y1="61" x2="50" y2="91" stroke="#351F29" stroke-width="1" />
  <circle cx="48" cy="79" r="1" fill="#FBC531" />
  <circle cx="52" cy="79" r="1" fill="#FBC531" />

  <!-- Degrau de Entrada -->
  <rect x="38" y="89.5" width="24" height="2.5" rx="1" fill="#FFF8F0" stroke="#E5C4B5" stroke-width="0.8" />
</svg>