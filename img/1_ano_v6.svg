    <polygon points="3.5,43.5 6.5,43.5 5,46" fill="#2D3436" />
  </g>

  <!-- Corpo Principal da Mochila -->
  <rect x="22" y="28" width="56" height="58" rx="18" fill="url(#bag-main)" />
  <path d="M 28 32 C 38 29 62 29 72 32" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.4" />

  <!-- Bolso Frontal 3D -->
  <rect x="28" y="52" width="44" height="30" rx="10" fill="url(#pocket-grad)" />
  <path d="M 28 52 L 72 52" stroke="#48DBFB" stroke-width="3" stroke-linecap="round" />
  <circle cx="50" cy="52" r="3" fill="#FECA57" />

  <!-- Emblema da Estrela -->
  <circle cx="50" cy="67" r="6" fill="white" opacity="0.9" />
  <path d="M 50 62 L 51.5 65.5 L 55 66 L 52.5 68.5 L 53 72 L 50 70 L 47 72 L 47.5 68.5 L 45 66 L 48.5 65.5 Z" fill="#FF9F43" />
