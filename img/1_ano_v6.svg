<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 11 70 86" width="100%" height="100%">
  <defs>
    <radialGradient id="bag-main" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="70%" stop-color="#EE5253" />
      <stop offset="100%" stop-color="#C0392B" />
    </radialGradient>
    <radialGradient id="pocket-grad" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FF9FF3" />
      <stop offset="100%" stop-color="#F368E0" />
    </radialGradient>
    <linearGradient id="pencil-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FECA57" />
      <stop offset="50%" stop-color="#FF9F43" />
      <stop offset="100%" stop-color="#E67E22" />
    </linearGradient>
  </defs>

  <ellipse cx="50" cy="90" rx="35" ry="6.5" fill="rgba(0,0,0,0.2)" />

  <!-- Alça da Mochila -->
  <path d="M 36 28 C 36 14 64 14 64 28" fill="none" stroke="#C0392B" stroke-width="6" stroke-linecap="round" />
  <path d="M 36 28 C 36 14 64 14 64 28" fill="none" stroke="#FF8E8E" stroke-width="2" stroke-linecap="round" />

  <!-- Lápis Mágico -->
  <g transform="translate(62, 16) rotate(18)">
